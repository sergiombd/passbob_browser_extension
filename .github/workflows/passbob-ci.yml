# Passbob CI: test and build the extension against the passbob styleguide, publish unpacked builds on tags.
#
# The extension depends on "file:../passbolt_styleguide", so both repositories are checked out side by side.
# The styleguide repository is private: it is cloned with a read-only deploy key (secret STYLEGUIDE_DEPLOY_KEY).
# Its branch with the same name as this one is used when it exists, "passbob" otherwise.
#
# Releases: push a tag like v5.16.1-passbob.1 → Chrome and Firefox unpacked builds attached to a GitHub Release.
name: Passbob CI

on:
  push:
    branches: [passbob]
    tags: ["v*-passbob.*"]
  pull_request:
    branches: [passbob]
  workflow_dispatch:

concurrency:
  group: passbob-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  STYLEGUIDE_REPO: git@github.com:sergiombd/passbob_styleguide.git

jobs:
  test:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          path: passbolt_browser_extension

      - name: Clone the passbob styleguide
        env:
          DEPLOY_KEY: ${{ secrets.STYLEGUIDE_DEPLOY_KEY }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: passbolt_browser_extension/.github/scripts/clone-styleguide.sh

      - uses: actions/setup-node@v4
        with:
          node-version-file: passbolt_browser_extension/.nvmrc
          cache: npm
          cache-dependency-path: |
            passbolt_browser_extension/package-lock.json
            passbolt_styleguide/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --prefix passbolt_styleguide --no-audit --no-fund
          npm ci --prefix passbolt_browser_extension --no-audit --no-fund

      - name: Lint
        working-directory: passbolt_browser_extension
        run: npm run lint:eslint

      # The runners have 2 slow cores: allow slow tests (KDBX key derivation) more time, skip the "[performance]" tests,
      # which measure the runner speed rather than the code, and re-run only the failed tests once to absorb timing
      # hiccups (a real failure fails twice).
      - name: Unit tests
        working-directory: passbolt_browser_extension
        run: |
          run_tests() {
            npx jest --silent --maxWorkers=2 --testTimeout=30000 \
              --testNamePattern='^((?!\[performance\]).)*$' "$@" ./src/all/ ./src/chrome-mv3/ ./src/chrome/
          }
          if ! run_tests; then
            echo "::warning::Some tests failed, re-running only the failed ones once"
            run_tests --onlyFailures
          fi

  build:
    name: Build unpacked extensions
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: passbolt_browser_extension

      - name: Clone the passbob styleguide
        env:
          DEPLOY_KEY: ${{ secrets.STYLEGUIDE_DEPLOY_KEY }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: passbolt_browser_extension/.github/scripts/clone-styleguide.sh

      - uses: actions/setup-node@v4
        with:
          node-version-file: passbolt_browser_extension/.nvmrc
          cache: npm
          cache-dependency-path: |
            passbolt_browser_extension/package-lock.json
            passbolt_styleguide/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --prefix passbolt_styleguide --no-audit --no-fund
          npm ci --prefix passbolt_browser_extension --no-audit --no-fund

      - name: Build the styleguide (themes CSS)
        working-directory: passbolt_styleguide
        run: npm run build

      - name: Build Chrome (MV3)
        working-directory: passbolt_browser_extension
        run: npm run build:chromium-mv3

      - name: Build Firefox
        working-directory: passbolt_browser_extension
        run: npm run build:firefox

      - name: Name the packages
        id: package
        working-directory: passbolt_browser_extension
        env:
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then label="$REF_NAME"; else label="build-${SHA::7}"; fi
          mkdir -p ../packages
          cp dist/chromium-mv3/*.zip "../packages/passbob-chrome-${label}.zip"
          cp dist/firefox/*.zip "../packages/passbob-firefox-${label}.zip"
          ls -la ../packages
          echo "label=$label" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: passbob-${{ steps.package.outputs.label }}
          path: packages/*.zip
          retention-days: 14

  release:
    name: Publish the GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: passbolt_browser_extension

      - uses: actions/download-artifact@v4
        with:
          name: passbob-${{ github.ref_name }}
          path: packages

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" packages/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "Passbob $TAG" \
            --notes-file passbolt_browser_extension/.github/release-notes-template.md \
            --verify-tag
